services:
  - type: web
    name: sh-inventory-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sh-inventory-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://sh-inventory.vercel.app # The user should replace this with their actual Vercel URL
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: ap-south-1

databases:
  - name: sh-inventory-db
    plan: free
